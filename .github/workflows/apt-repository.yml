name: Publish APT repository
# Only indexes existing Release packages. No builds, player execution or regression tests.
on:
  workflow_dispatch:
  release:
    types: [published]
  workflow_run:
    workflows: [release]
    types: [completed]
  schedule:
    - cron: '23 3 * * 1'
permissions:
  contents: read
concurrency:
  group: apt-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: master
          persist-credentials: false
      - name: Install repository tools
        run: sudo apt-get update && sudo apt-get install -y apt-utils gnupg
      - name: Import dedicated signing key
        env:
          APT_SIGNING_PRIVATE_KEY: ${{ secrets.APT_SIGNING_PRIVATE_KEY }}
        shell: python
        run: |
          import os, pathlib, subprocess
          home = pathlib.Path(os.environ["RUNNER_TEMP"]) / "aino-apt-gnupg"
          home.mkdir(mode=0o700)
          os.environ["GNUPGHOME"] = str(home)
          key = os.environ["APT_SIGNING_PRIVATE_KEY"]
          if not key:
              raise SystemExit("Missing dedicated APT_SIGNING_PRIVATE_KEY secret")
          subprocess.run(["gpg", "--batch", "--import"], input=key.encode(), check=True)
          fingerprint = pathlib.Path("packaging/apt/signing-key-fingerprint.txt").read_text().strip()
          listing = subprocess.check_output(["gpg", "--batch", "--with-colons", "--list-secret-keys", fingerprint], text=True)
          if not any(line.startswith("fpr:") and line.split(":")[9] == fingerprint for line in listing.splitlines()):
              raise SystemExit("Signing key does not match the committed public fingerprint")
          with open(os.environ["GITHUB_ENV"], "a") as environment:
              environment.write(f"GNUPGHOME={home}\nAPT_SIGNING_FINGERPRINT={fingerprint}\n")
      - name: Build signed indexes and check APT candidate
        env:
          GH_TOKEN: ${{ github.token }}
          LC_ALL: C.UTF-8
        run: python3 tools/build_apt_repository.py --output build/apt-site --fingerprint "$APT_SIGNING_FINGERPRINT" --verify-apt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/apt-site
      - name: Deploy repository
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Remove temporary signing material
        if: always()
        shell: python
        run: |
          import os, pathlib, shutil, subprocess
          home = pathlib.Path(os.environ["RUNNER_TEMP"]) / "aino-apt-gnupg"
          if home.exists():
              subprocess.run(["gpgconf", "--homedir", str(home), "--kill", "gpg-agent"], check=False)
              shutil.rmtree(home)
