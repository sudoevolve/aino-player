name: build-and-test
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-24.04
    env:
      # 使用镜像中 Chrome 的 SUID 沙箱，兼容 Ubuntu 的 userns 限制。
      CHROME_DEVEL_SANDBOX: /opt/google/chrome/chrome-sandbox
    steps:
      - uses: actions/checkout@v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev libcurl4-openssl-dev libfreetype6 libfontconfig1 fonts-noto-cjk xvfb ffmpeg
      - run: test -u "$CHROME_DEVEL_SANDBOX" && cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DAINO_TEST_BROWSER=/usr/bin/google-chrome
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: cmake -S . -B build -DBUILD_TESTING=ON
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure
