name: build-and-test
# 日常提交不自动跑回归；新版本由 release.yml 执行完整检查。
on: workflow_dispatch
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y build-essential python3 libx11-dev libcurl4-openssl-dev libfreetype6 libfontconfig1 fonts-noto-cjk xvfb
      - run: python3 tools/build_ffmpeg.py --jobs 2
      # 临时 CI 虚拟机允许 Chrome 创建沙箱 userns；浏览器沙箱仍保持启用。
      - run: if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DAINO_TEST_BROWSER=/usr/bin/google-chrome
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - name: Report Linux DPI and resident memory
        run: xvfb-run -a build/aino_player --diagnostics
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc make
      - name: Build minimal audio decoder
        shell: pwsh
        run: |
          $env:Path = "C:\msys64\ucrt64\bin;C:\msys64\usr\bin;$env:Path"
          python tools/build_ffmpeg.py --jobs 2
      - run: cmake -S . -B build -DBUILD_TESTING=ON
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure
