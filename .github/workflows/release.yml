name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string
      platform:
        description: Build both to publish; a single platform only uploads validated artifacts
        required: true
        default: both
        type: choice
        options: [both, windows, linux]
permissions:
  contents: read
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'linux'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc make
      - name: Build minimal audio decoder
        shell: pwsh
        run: |
          $env:Path = "C:\msys64\ucrt64\bin;C:\msys64\usr\bin;$env:Path"
          python tools/build_ffmpeg.py --jobs 2
      - run: cmake -S . -B build -A x64 -DAINO_BUILD_TESTS=ON
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure --no-tests=error
      - name: Prepare Windows executable
        shell: python
        run: |
          import os, pathlib, shutil, subprocess
          tag = os.environ["RELEASE_TAG"]
          assert tag.startswith("v"), f"Expected a version tag: {tag}"
          expected = "aino player " + tag[1:]
          actual = subprocess.check_output(["build/Release/aino_player.exe", "--version"], text=True).strip()
          assert actual == expected, f"Version mismatch: {actual} / {expected}"
          codec = subprocess.check_output(["build/Release/aino_player.exe", "--codec-info"], text=True).strip()
          assert "embedded" in codec, f"Release must embed the decoder: {codec}"
          notice = subprocess.check_output(["build/Release/aino_player.exe", "--ffmpeg-license"], text=True)
          assert "GNU LESSER GENERAL PUBLIC LICENSE" in notice
          pathlib.Path("dist").mkdir(exist_ok=True)
          shutil.copy2("build/Release/aino_player.exe", f"dist/aino-player-{tag}-windows-x64.exe")
          shutil.copy2("build/codec/FFmpeg-BUILD.txt", "dist/FFmpeg-BUILD-windows.txt")
      - name: Build compressed per-user Windows installer
        run: python tools/build_installer.py --exe build/Release/aino_player.exe --output dist
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-exe
          path: |
            dist/*.exe
            dist/FFmpeg-BUILD-windows.txt
          if-no-files-found: error
  linux:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'windows'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - run: sudo apt-get update && sudo apt-get install -y build-essential python3 libx11-dev libdbus-1-dev pkg-config libgdk-pixbuf-2.0-0 librsvg2-common adwaita-icon-theme libcurl4-openssl-dev libfreetype6 libfontconfig1 fonts-noto-cjk libasound2 xvfb xdg-utils dpkg-dev appstream
      - run: python3 tools/check_file_associations.py
      - run: python3 tools/build_ffmpeg.py --jobs 2
      # 只调整临时 CI 虚拟机的 userns 策略，不给浏览器添加 --no-sandbox。
      - run: if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DAINO_BUILD_TESTS=ON -DAINO_TEST_BROWSER=/usr/bin/google-chrome
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure --no-tests=error
      - name: Report Linux DPI and resident memory
        run: xvfb-run -a build/aino_player --diagnostics
      - name: Build and verify Debian package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$(build/aino_player --version)" = "aino player ${RELEASE_TAG#v}"
          build/aino_player --codec-info | grep -F embedded
          cpack --config build/CPackConfig.cmake -G DEB -B dist
          dpkg-deb --info dist/*.deb
          test "$(dpkg-deb --field dist/*.deb Maintainer)" = "sudoevolve <sudoevolve@gmail.com>"
          appstreamcli validate --no-net build/generated/io.github.sudoevolve.AinoPlayer.metainfo.xml
          # 先装上一正式版，再覆盖升级；不以卸载旧版绕过升级问题。
          previous_tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          if [ "$previous_tag" != "$RELEASE_TAG" ]; then
            gh release download "$previous_tag" --repo "$GITHUB_REPOSITORY" --dir build/previous-release --pattern '*.deb' --pattern SHA256SUMS.txt
            # 早期版本的校验清单由 Windows 生成，兼容 CRLF，不改变摘要或文件内容。
            (cd build/previous-release && tr -d '\r' < SHA256SUMS.txt | sha256sum --check --ignore-missing -)
            test "$(dpkg-deb --field build/previous-release/*.deb Package)" = aino-player
            sudo apt-get install -y --no-remove ./build/previous-release/*.deb
            previous_version="$(dpkg-query -W -f='${Version}' aino-player)"
            dpkg --compare-versions "$previous_version" lt "${RELEASE_TAG#v}"
          fi
          sudo apt-get install -y --no-remove ./dist/*.deb
          test "$(dpkg-query -W -f='${Version}' aino-player)" = "${RELEASE_TAG#v}"
          test -f /usr/share/metainfo/io.github.sudoevolve.AinoPlayer.metainfo.xml
          test "$(/usr/bin/aino_player --version)" = "aino player ${RELEASE_TAG#v}"
          xvfb-run -a /usr/bin/aino_player --smoke-test
          cp build/codec-build/ffmpeg-*.tar.xz dist/
          cp build/codec/FFmpeg-BUILD.txt dist/FFmpeg-BUILD-linux.txt
          cp vendor/LICENSE.FFmpeg.txt dist/
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: linux-deb
          path: |
            dist/*.deb
            dist/ffmpeg-*.tar.xz
            dist/FFmpeg-BUILD-linux.txt
            dist/LICENSE.FFmpeg.txt
          if-no-files-found: error
  rpm:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'windows'
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: Install build dependencies
        run: dnf install -y git cmake gcc gcc-c++ make python3 pkgconf-pkg-config libX11-devel dbus-devel libcurl-devel rpm-build xorg-x11-server-Xvfb xdg-utils google-noto-sans-cjk-ttc-fonts adwaita-icon-theme gdk-pixbuf2 librsvg2 dbus-libs alsa-lib curl ca-certificates fontconfig freetype
      - run: python3 tools/check_file_associations.py
      - run: python3 tools/build_ffmpeg.py --jobs 2
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DAINO_BUILD_TESTS=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure --no-tests=error
      - name: Build and verify RPM package
        shell: bash
        run: |
          test "$(build/aino_player --version)" = "aino player ${RELEASE_TAG#v}"
          build/aino_player --codec-info | grep -F embedded
          cpack --config build/CPackConfig.cmake -G RPM -B dist
          test "$(rpm -qp --qf '%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}\n' dist/*.rpm)" = "aino-player-${RELEASE_TAG#v}-1.x86_64"
          test "$(rpm -qp --qf '%{LICENSE}\n' dist/*.rpm)" = "Apache-2.0"
          dnf install -y ./dist/*.rpm
          test -f /usr/share/metainfo/io.github.sudoevolve.AinoPlayer.metainfo.xml
          test "$(/usr/bin/aino_player --version)" = "aino player ${RELEASE_TAG#v}"
          xvfb-run -a /usr/bin/aino_player --smoke-test
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: linux-rpm
          path: dist/*.rpm
          if-no-files-found: error
  arch:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'windows'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed sudo git cmake python libx11 dbus curl fontconfig freetype2 gdk-pixbuf2 librsvg adwaita-icon-theme alsa-lib libpulse xorg-server-xvfb noto-fonts-cjk xdg-utils
      - name: Prepare makepkg workspace
        shell: bash
        run: |
          sed -i "s/^pkgver=.*/pkgver=${RELEASE_TAG#v}/" packaging/arch/PKGBUILD
          # PKGBUILD 的 $srcdir 是 startdir/src，把检出放到 makepkg 期望的位置。
          mkdir -p /tmp/pkgbuild/src
          cp -r . /tmp/pkgbuild/src/aino-player
          cp packaging/arch/PKGBUILD /tmp/pkgbuild/
          cd /tmp/pkgbuild/src/aino-player
          python3 tools/build_ffmpeg.py --jobs 2
          useradd -m builder
          chown -R builder: /tmp/pkgbuild
      - name: Build and verify Arch package
        shell: bash
        run: |
          cd /tmp/pkgbuild
          sudo -u builder makepkg -f
          test "$(ls aino-player-*.pkg.tar.zst | wc -l)" -eq 1
          pacman -U --noconfirm aino-player-*.pkg.tar.zst
          test "$(/usr/bin/aino_player --version)" = "aino player ${RELEASE_TAG#v}"
          /usr/bin/aino_player --codec-info | grep -F embedded
          test -f /usr/share/metainfo/io.github.sudoevolve.AinoPlayer.metainfo.xml
          xvfb-run -a /usr/bin/aino_player --smoke-test
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp aino-player-*.pkg.tar.zst "$GITHUB_WORKSPACE/dist/"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: linux-arch
          path: dist/*.pkg.tar.zst
          if-no-files-found: error
  publish:
    needs: [windows, linux, rpm, arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish tested assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cd dist
          sha256sum *.exe *.deb *.rpm *.pkg.tar.zst *.tar.xz FFmpeg-BUILD-*.txt LICENSE.FFmpeg.txt > SHA256SUMS.txt
          cd ..
          gh release create "$RELEASE_TAG" dist/*.exe dist/*.deb dist/*.rpm dist/*.pkg.tar.zst dist/*.tar.xz dist/FFmpeg-BUILD-*.txt dist/LICENSE.FFmpeg.txt dist/SHA256SUMS.txt --verify-tag --title "aino player $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md --latest
