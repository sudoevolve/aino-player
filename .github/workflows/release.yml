name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string
permissions:
  contents: read
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc make
      - name: Build minimal audio decoder
        shell: pwsh
        run: |
          $env:Path = "C:\msys64\ucrt64\bin;C:\msys64\usr\bin;$env:Path"
          python tools/build_ffmpeg.py --jobs 2
      - run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Prepare Windows executable
        shell: python
        run: |
          import os, pathlib, shutil, subprocess
          tag = os.environ["RELEASE_TAG"]
          assert tag.startswith("v"), f"Expected a version tag: {tag}"
          expected = "aino player " + tag[1:]
          actual = subprocess.check_output(["build/Release/aino_player.exe", "--version"], text=True).strip()
          assert actual == expected, f"Version mismatch: {actual} / {expected}"
          codec = subprocess.check_output(["build/Release/aino_player.exe", "--codec-info"], text=True).strip()
          assert "embedded" in codec, f"Release must embed the decoder: {codec}"
          notice = subprocess.check_output(["build/Release/aino_player.exe", "--ffmpeg-license"], text=True)
          assert "GNU LESSER GENERAL PUBLIC LICENSE" in notice
          pathlib.Path("dist").mkdir(exist_ok=True)
          shutil.copy2("build/Release/aino_player.exe", f"dist/aino-player-{tag}-windows-x64.exe")
          shutil.copy2("build/codec/FFmpeg-BUILD.txt", "dist/FFmpeg-BUILD-windows.txt")
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-exe
          path: |
            dist/*.exe
            dist/FFmpeg-BUILD-windows.txt
          if-no-files-found: error
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - run: sudo apt-get update && sudo apt-get install -y build-essential python3 libx11-dev libcurl4-openssl-dev libfreetype6 libfontconfig1 fonts-noto-cjk libasound2 xvfb xdg-utils dpkg-dev
      - run: python3 tools/build_ffmpeg.py --jobs 2
      # 只调整临时 CI 虚拟机的 userns 策略，不给浏览器添加 --no-sandbox。
      - run: if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_TESTING=ON -DAINO_TEST_BROWSER=/usr/bin/google-chrome
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - name: Build and verify Debian package
        shell: bash
        run: |
          test "$(build/aino_player --version)" = "aino player ${RELEASE_TAG#v}"
          build/aino_player --codec-info | grep -F embedded
          cpack --config build/CPackConfig.cmake -G DEB -B dist
          dpkg-deb --info dist/*.deb
          sudo apt-get install -y ./dist/*.deb
          test "$(/usr/bin/aino_player --version)" = "aino player ${RELEASE_TAG#v}"
          xvfb-run -a /usr/bin/aino_player --smoke-test
          cp build/codec-build/ffmpeg-*.tar.xz dist/
          cp build/codec/FFmpeg-BUILD.txt dist/FFmpeg-BUILD-linux.txt
          cp vendor/LICENSE.FFmpeg.txt dist/
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: linux-deb
          path: |
            dist/*.deb
            dist/ffmpeg-*.tar.xz
            dist/FFmpeg-BUILD-linux.txt
            dist/LICENSE.FFmpeg.txt
          if-no-files-found: error
  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish tested assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cd dist
          sha256sum *.exe *.deb *.tar.xz FFmpeg-BUILD-*.txt LICENSE.FFmpeg.txt > SHA256SUMS.txt
          cd ..
          gh release create "$RELEASE_TAG" dist/*.exe dist/*.deb dist/*.tar.xz dist/FFmpeg-BUILD-*.txt dist/LICENSE.FFmpeg.txt dist/SHA256SUMS.txt --verify-tag --title "aino player $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md --latest
